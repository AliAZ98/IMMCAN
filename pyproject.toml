[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "immcan"
version = "0.1.0"
description = "IMMCAN research code for idiom-aware multimodal image ranking"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1",
    "transformers>=4.47,<5",
    "numpy>=1.24",
    "pandas>=2.0",
    "Pillow>=10",
    "sentencepiece>=0.2",
    "safetensors>=0.4",
    "timm>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
